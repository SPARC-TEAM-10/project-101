openapi: 3.0.3
info:
  title: Community Health Hub API
  description: >
    API contract for the Community Health Hub (CHH) platform — blood donors,
    seekers, hospitals, and NGOs. Single source of truth for both the backend
    and frontend Coding Agents (see `.claude/rules/api-standards.md` §3).
  version: "1.0"
servers:
  - url: /api/v1
    description: CHH API v1 base path
tags:
  - name: Auth
    description: Mobile-number + OTP authentication (CHH-F01)
  - name: Individuals
    description: Individual user registration (CHH-F02)
  - name: BloodRequests
    description: Blood requests with proximity search radius (CHH-F04, Epic CHH-25)
  - name: Facilities
    description: Facility (hospital/blood-bank or NGO) self-registration (CHH-F03/CHH-78)
  - name: Admin
    description: >
      System Admin moderation endpoints (CHH-F07 Admin Command Center, Epic
      CHH-72). Interim admin identity: mobile numbers whose
      IndividualProfile.IsAdmin flag is set are issued the "SystemAdmin" role
      on OTP verification — see the CHH-F07 LLD "Cross-cutting decisions" for why.
      Real Role/RoleId-based authorization (PRD §4) is future scope.
paths:
  /auth/otp/request:
    post:
      tags:
        - Auth
      summary: Request a one-time password for a mobile number
      description: >
        Accepts a 10-digit mobile number, generates and dispatches a 6-digit
        OTP via the SMS gateway, and returns confirmation data. Does not
        create an addressable resource, so a successful call returns
        `200 OK` rather than `201 Created` (`.claude/rules/api-standards.md` §1).
        Verifying the code is a separate endpoint (CHH-9), out of scope here.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestRequest"
      responses:
        "200":
          description: OTP generated and dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "422":
          description: Mobile number missing or not a valid 10-digit number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Resend requested before the resend cooldown elapsed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: The SMS gateway failed to dispatch the OTP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify a one-time password for a mobile number
      description: >
        Accepts a mobile number and the 6-digit code sent to it, and checks it
        against the most recently issued OTP for that number. On success,
        issues a JWT access token (CHH-F01 AC3) carrying the mobile number and
        a role claim — "Individual" if a completed registration exists for
        this number (CHH-F02), otherwise "Guest". Both cases return `200 OK`
        with the token; role-specific redirection is a frontend concern.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified; access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "422":
          description: >
            Request malformed (mobile number/OTP code shape), the OTP code is
            wrong, or it has expired. A wrong code and "no OTP was ever
            requested for this number" deliberately share the same message
            (to avoid revealing which case occurred) — an expired code is
            reported distinctly since expiry is unambiguous once a matching
            OTP record exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /individuals:
    post:
      tags:
        - Individuals
      summary: Register an individual profile
      description: >
        Creates the individual profile completed after OTP verification
        (CHH-F02): personal details, blood group, DOB, gender, location, and
        health screening. `mobileNumber` must have a verified OTP already
        (CHH-9) — creates an addressable resource, so a successful call
        returns `201 Created` with a `Location` header
        (`.claude/rules/api-standards.md` §1/§2).
      operationId: registerIndividual
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndividualProfileRequest"
      responses:
        "201":
          description: Individual profile created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualProfileDto"
        "422":
          description: >
            Request malformed (field-level validation) or the mobile number
            does not have a verified OTP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: An individual profile already exists for this mobile number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /individuals/me:
    get:
      tags:
        - Individuals
      summary: Get my own individual profile
      description: >
        Returns the authenticated caller's own profile (CHH-81 Individual
        Dashboard). 404 if the JWT's mobile number hasn't completed
        registration yet.
      operationId: getMyIndividualProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualProfileDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No individual profile exists for this mobile number yet.
  /blood-requests:
    post:
      tags:
        - BloodRequests
      summary: Create a blood request with a search radius
      description: >
        Creates a blood request (CHH-33/US-CHH-004-01, part of Epic CHH-25 —
        CHH-F04 Proximity Notifications) and transitions it to "Matching"
        (AC1). The requester is the authenticated caller — taken from the
        JWT, never a request body field. Creates an addressable resource, so
        a successful call returns `201 Created` with a `Location` header
        (`.claude/rules/api-standards.md` §1/§2). Donor matching and
        notification dispatch (CHH-34+) are out of scope here.
      operationId: createBloodRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBloodRequestRequest"
      responses:
        "201":
          description: Blood request created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created blood request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloodRequestDto"
        "422":
          description: >
            Request malformed (field-level validation) — including a search
            radius outside 5–100km (AC2/AC3), a missing mandatory field
            (AC4), or device location coordinates that could not be resolved
            (Edge Case).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid JWT.
  /facilities/me:
    get:
      tags:
        - Facilities
      summary: Get the caller's own facility and its verification status
      description: >
        Returns the facility owned by the authenticated caller (CHH-28/
        US-CHH-003-03, part of Epic CHH-77 — CHH-F03 Facility Verification),
        resolved by matching the JWT's mobile number against a facility
        contact — the same lookup used to grant the Hospital/Ngo role on
        OTP verify (CHH-10). Restricted to the Hospital and Ngo roles.
      operationId: getMyFacility
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's facility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: The caller's mobile number isn't a contact on any facility.
  /blood-requests/mine:
    get:
      tags:
        - BloodRequests
      summary: List my own blood requests
      description: >
        Returns the authenticated caller's own blood requests, newest first
        (CHH-81 Individual Dashboard). An empty result is a normal `200`
        with an empty `items` array.
      operationId: listMyBloodRequests
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of the caller's own blood requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfBloodRequestDto"
        "401":
          description: Missing or invalid JWT.
  /facilities:
    post:
      tags:
        - Facilities
      summary: Register a facility
      description: >
        Creates a facility (hospital/blood-bank or NGO), pending System Admin
        verification (CHH-F03/CHH-78): name, category, sub-category, licence
        number, address, and 1–3 contacts. No JWT role is issued for
        Hospital/NGO yet (see CHH-F07's interim-admin note), so this is
        `security: []` like individual registration — creates an addressable
        resource, so a successful call returns `201 Created` with a
        `Location` header (`.claude/rules/api-standards.md` §1/§2).
      operationId: registerFacility
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFacilityRequest"
      responses:
        "201":
          description: Facility created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created facility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityDto"
        "422":
          description: >
            Request malformed (field-level validation) — including a
            sub-category that doesn't belong to the selected category.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: A facility already exists for this licence number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /facilities/{id}/upload:
    post:
      tags:
        - Facilities
      summary: Upload a facility's license document
      description: >
        Uploads (or replaces) a facility's license document (CHH-79/US-CHH-003-02),
        stored in blob storage (`.claude/rules/db-standards.md` §3) — this
        response's `licenseDocumentUrl` is what CHH-74's document-review
        modal opens. `security: []`, same reasoning as `POST /facilities`:
        the wizard uploads immediately after anonymous registration, before
        any JWT role exists for the caller.
      operationId: uploadFacilityLicenseDocument
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The facility, with its updated licenseDocumentUrl.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityDto"
        "404":
          description: No such facility.
        "422":
          description: The file's type isn't PDF/JPEG/PNG, it exceeds 5MB, or none was provided.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /admin/facilities/pending:
    get:
      tags:
        - Admin
      summary: List facilities pending verification
      description: >
        Returns facilities with `verificationStatus = Pending`, ordered by
        registration date, for the System Admin's "Pending Verification" tab
        (CHH-73/US-CHH-001-01 AC1). An empty result is a normal `200` with an
        empty `items` array — the "No pending verifications at this time"
        message (AC2) is a frontend concern, not a distinct API shape.
      operationId: listPendingFacilities
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of pending facilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfFacilityDto"
        "401":
          description: Missing or invalid JWT.
        "403":
          description: Authenticated caller does not carry the SystemAdmin role.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /auth/otp/verify (CHH-F01 AC3).
  schemas:
    OtpRequestRequest:
      type: object
      required:
        - mobileNumber
      properties:
        mobileNumber:
          type: string
          description: Exactly 10 digits, numeric only.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
    OtpRequestResponse:
      type: object
      required:
        - maskedMobileNumber
        - otpExpiresAtUtc
        - resendAvailableAtUtc
      properties:
        maskedMobileNumber:
          type: string
          description: All but the last 2 digits masked.
          example: "********10"
        otpExpiresAtUtc:
          type: string
          format: date-time
          description: UTC timestamp the OTP code expires (requested + 5 minutes).
        resendAvailableAtUtc:
          type: string
          format: date-time
          description: UTC timestamp a resend becomes available (requested + 120 seconds).
    OtpVerifyRequest:
      type: object
      required:
        - mobileNumber
        - otpCode
      properties:
        mobileNumber:
          type: string
          description: Exactly 10 digits, numeric only.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
        otpCode:
          type: string
          description: Exactly 6 digits, numeric only.
          pattern: "^[0-9]{6}$"
          example: "123456"
    OtpVerifyResponse:
      type: object
      required:
        - maskedMobileNumber
        - verifiedAtUtc
        - accessToken
        - tokenExpiresAtUtc
        - role
      properties:
        maskedMobileNumber:
          type: string
          description: All but the last 2 digits masked.
          example: "********10"
        verifiedAtUtc:
          type: string
          format: date-time
          description: UTC timestamp the OTP was successfully verified.
        accessToken:
          type: string
          description: >
            Signed JWT session token (CHH-F01 AC3). Carries the mobile number
            (`sub`) and `role` claims. Send as `Authorization: Bearer
            <accessToken>` on subsequent requests.
        tokenExpiresAtUtc:
          type: string
          format: date-time
          description: >
            UTC expiry of accessToken (24 hours from issuance — widened from
            the original CHH-F01 AC3 1-hour value by explicit product
            decision, 2026-09-07).
        role:
          type: string
          description: >
            Role assigned for this session (PRD §4 Role & Permission Matrix).
            "Individual" if a completed registration exists for this mobile
            number; "Hospital"/"Ngo" if the number matches a facility contact
            (CHH-73, regardless of the facility's verification status);
            "SystemAdmin" if the individual profile's IsAdmin flag is set;
            otherwise "Guest".
          enum: ["Guest", "Individual", "Hospital", "Ngo", "SystemAdmin"]
    BloodGroup:
      type: string
      description: Clinical blood group notation.
      enum: ["A+", "A-", "B+", "B-", "O+", "O-", "AB+", "AB-"]
    Gender:
      type: string
      enum: ["Male", "Female", "Other"]
    CreateIndividualProfileRequest:
      type: object
      required:
        - mobileNumber
        - fullName
        - email
        - bloodGroup
        - dateOfBirth
        - gender
        - locationCityArea
      properties:
        mobileNumber:
          type: string
          description: Must have a verified OTP (CHH-9) already.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
        fullName:
          type: string
          description: 2–50 characters after trimming.
          example: "Jane Doe"
        email:
          type: string
          format: email
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        dateOfBirth:
          type: string
          format: date
          description: Must be in the past and indicate an age of 18 or older.
        gender:
          $ref: "#/components/schemas/Gender"
        locationCityArea:
          type: string
          description: >
            City/area, free text for now — a predefined/searchable list is an
            open product question (see the CHH-F02 doc's Open Questions).
        isChronicIllness:
          type: boolean
          default: false
        hasRecentSurgery:
          type: boolean
          default: false
        isInfectiousDisease:
          type: boolean
          default: false
        isUnderweight:
          type: boolean
          default: false
        isOtherIllness:
          type: boolean
          default: false
        otherIllnessDetails:
          type: string
          description: Required (max 200 chars) when isOtherIllness is true.
          maxLength: 200
    IndividualProfileDto:
      type: object
      description: >
        Deliberately excludes email, DOB, and health-screening detail — PII
        the registration-confirmation response doesn't need to echo back.
      required:
        - id
        - fullName
        - bloodGroup
        - isReceiverOnly
        - locationCityArea
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        isReceiverOnly:
          type: boolean
          description: >
            True if any health-restriction flag was set — excluded from
            donor search, can still request blood (PRD §7 CHH-F02 AC2).
        locationCityArea:
          type: string
          description: Registered city/area (CHH-81 dashboard profile summary).
        createdAtUtc:
          type: string
          format: date-time
    UrgencyLevel:
      type: string
      enum: ["Emergency", "Urgent", "Standard"]
    BloodRequestStatus:
      type: string
      description: >
        Only "Matching" is set on creation (AC1). "Expired" is set by the
        donor-matching/notification stories later in this epic (CHH-34+).
      enum: ["Matching", "Expired"]
    CreateBloodRequestRequest:
      type: object
      required:
        - requesterName
        - patientName
        - bloodGroup
        - unitsRequired
        - locationCityArea
        - latitude
        - longitude
        - searchRadiusKm
        - urgency
      properties:
        requesterName:
          type: string
          description: >
            The requester's own name — distinct from patientName (the person
            needing blood, who may not be the requester). Required for every
            requester, Guest or Individual: a Guest session has no registered
            profile to pull a name from, so the backend always requires it
            explicitly rather than looking it up.
        patientName:
          type: string
          description: 2–100 characters after trimming.
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        unitsRequired:
          type: integer
          description: Must be greater than 0.
          minimum: 1
        locationCityArea:
          type: string
          description: City/area, free text (same simplification as individual registration).
          maxLength: 100
        latitude:
          type: number
          format: double
          description: >
            From the requester's device (browser/device Geolocation) — not
            server-side geocoding (no maps API key configured yet). A
            missing/unresolvable value is the story's documented Edge Case.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          description: From the requester's device — see latitude.
          minimum: -180
          maximum: 180
        searchRadiusKm:
          type: integer
          description: Must be between 5 and 100 inclusive (AC2/AC3).
          minimum: 5
          maximum: 100
        urgency:
          $ref: "#/components/schemas/UrgencyLevel"
    BloodRequestDto:
      type: object
      required:
        - id
        - requesterName
        - patientName
        - bloodGroup
        - unitsRequired
        - locationCityArea
        - searchRadiusKm
        - urgency
        - status
        - createdAtUtc
        - expiresAtUtc
      properties:
        id:
          type: string
          format: uuid
        requesterName:
          type: string
        patientName:
          type: string
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        unitsRequired:
          type: integer
        locationCityArea:
          type: string
        searchRadiusKm:
          type: integer
        urgency:
          $ref: "#/components/schemas/UrgencyLevel"
        status:
          $ref: "#/components/schemas/BloodRequestStatus"
        createdAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
          description: createdAtUtc plus the 6-hour validity window.
    FacilityCategory:
      type: string
      enum: ["Hospital", "Ngo"]
    FacilitySubCategory:
      type: string
      description: >
        Finer classification within FacilityCategory (CHH-78 follow-up).
        Hospital may pick Government/Private/Trust; Ngo may pick
        RegisteredSociety/Trust/Section8Company — Trust is valid for either.
      enum: ["Government", "Private", "Trust", "RegisteredSociety", "Section8Company"]
    FacilityVerificationStatus:
      type: string
      description: >
        Only "Pending" is set on creation (CHH-78 AC1). "Verified"/"Rejected"
        are set by the admin verification story (CHH-75).
      enum: ["Pending", "Verified", "Rejected"]
    CreateFacilityContactRequest:
      type: object
      required:
        - name
        - designation
        - mobile
      properties:
        name:
          type: string
        designation:
          type: string
        mobile:
          type: string
          pattern: "^[0-9]{10}$"
    CreateFacilityRequest:
      type: object
      required:
        - facilityName
        - category
        - subCategory
        - licenseNumber
        - address
        - contacts
      properties:
        facilityName:
          type: string
          description: Registered name, at least 3 characters after trimming.
          example: "City General Hospital"
        category:
          $ref: "#/components/schemas/FacilityCategory"
        subCategory:
          $ref: "#/components/schemas/FacilitySubCategory"
          description: Must be one of the sub-categories valid for the selected category.
        licenseNumber:
          type: string
          description: Letters, numbers and hyphens only, as printed on the licence.
          pattern: "^[A-Za-z0-9-]+$"
        address:
          type: string
          description: Free text — building, street, area, city, PIN code.
        contacts:
          type: array
          description: 1–3 contacts.
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/CreateFacilityContactRequest"
    FacilityContactDto:
      type: object
      required:
        - name
        - designation
        - mobile
      properties:
        name:
          type: string
        designation:
          type: string
        mobile:
          type: string
          pattern: "^[0-9]{10}$"
    FacilityDto:
      type: object
      required:
        - id
        - facilityName
        - category
        - subCategory
        - licenseNumber
        - address
        - contacts
        - verificationStatus
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        facilityName:
          type: string
        category:
          $ref: "#/components/schemas/FacilityCategory"
        subCategory:
          $ref: "#/components/schemas/FacilitySubCategory"
        licenseNumber:
          type: string
        address:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/FacilityContactDto"
        verificationStatus:
          $ref: "#/components/schemas/FacilityVerificationStatus"
        licenseDocumentUrl:
          type: string
          nullable: true
          description: Blob storage reference; populated by CHH-74's upload path, null until then.
        rejectionReason:
          type: string
          nullable: true
          description: >
            Admin's reason for rejection (CHH-28's status dashboard). Null
            unless verificationStatus is "Rejected" — no reject-with-reason
            endpoint exists yet (CHH-75), so this is currently only ever set
            by a manual DB operation.
        createdAtUtc:
          type: string
          format: date-time
          description: Also serves as "Date of Registration" (CHH-73 AC1).
        updatedAtUtc:
          type: string
          format: date-time
          description: >
            Doubles as the verification decision date on CHH-28's status
            dashboard, since no separate reviewed-at field exists yet.
    PagedResponseOfFacilityDto:
      type: object
      description: >
        Generic paging envelope (DOTNET-RULES §12) — this is the first
        paginated list endpoint in the contract; later list endpoints should
        follow the same `items`/`totalCount`/`page`/`pageSize` shape.
      required:
        - items
        - totalCount
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FacilityDto"
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    PagedResponseOfBloodRequestDto:
      type: object
      description: Generic paging envelope (DOTNET-RULES §12) — see PagedResponseOfFacilityDto.
      required:
        - items
