openapi: 3.0.3
info:
  title: Community Health Hub API
  description: >
    API contract for the Community Health Hub (CHH) platform — blood donors,
    seekers, hospitals, and NGOs. Single source of truth for both the backend
    and frontend Coding Agents (see `.claude/rules/api-standards.md` §3).
  version: "1.0"
servers:
  - url: /api/v1
    description: CHH API v1 base path
tags:
  - name: Auth
    description: Mobile-number + OTP authentication (CHH-F01)
paths:
  /auth/otp/request:
    post:
      tags:
        - Auth
      summary: Request a one-time password for a mobile number
      description: >
        Accepts a 10-digit mobile number, generates and dispatches a 6-digit
        OTP via the SMS gateway, and returns confirmation data. Does not
        create an addressable resource, so a successful call returns
        `200 OK` rather than `201 Created` (`.claude/rules/api-standards.md` §1).
        Verifying the code is a separate endpoint (CHH-9), out of scope here.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestRequest"
      responses:
        "200":
          description: OTP generated and dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "422":
          description: Mobile number missing or not a valid 10-digit number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Resend requested before the resend cooldown elapsed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: The SMS gateway failed to dispatch the OTP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify a one-time password for a mobile number
      description: >
        Accepts a mobile number and the 6-digit code sent to it, and checks it
        against the most recently issued (unexpired) OTP for that number.
        Verify-only (CHH-9 scope) — does not issue a session token; JWT
        issuance and role-based redirection are CHH-10.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "422":
          description: >
            Request malformed (mobile number/OTP code shape) or the OTP code
            is wrong, expired, or none was ever requested for this number.
            The same message and status is used for all three to avoid
            revealing which case occurred.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    OtpRequestRequest:
      type: object
      required:
        - mobileNumber
      properties:
        mobileNumber:
          type: string
          description: Exactly 10 digits, numeric only.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
    OtpRequestResponse:
      type: object
      required:
        - maskedMobileNumber
        - otpExpiresAtUtc
        - resendAvailableAtUtc
      properties:
        maskedMobileNumber:
          type: string
          description: All but the last 2 digits masked.
          example: "********10"
        otpExpiresAtUtc:
          type: string
          format: date-time
          description: UTC timestamp the OTP code expires (requested + 5 minutes).
        resendAvailableAtUtc:
          type: string
          format: date-time
          description: UTC timestamp a resend becomes available (requested + 120 seconds).
    OtpVerifyRequest:
      type: object
      required:
        - mobileNumber
        - otpCode
      properties:
        mobileNumber:
          type: string
          description: Exactly 10 digits, numeric only.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
        otpCode:
          type: string
          description: Exactly 6 digits, numeric only.
          pattern: "^[0-9]{6}$"
          example: "123456"
    OtpVerifyResponse:
      type: object
      required:
        - maskedMobileNumber
        - verifiedAtUtc
      properties:
        maskedMobileNumber:
          type: string
          description: All but the last 2 digits masked.
          example: "********10"
        verifiedAtUtc:
          type: string
          format: date-time
          description: UTC timestamp the OTP was successfully verified.
    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
