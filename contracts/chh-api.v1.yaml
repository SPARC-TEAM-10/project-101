openapi: 3.0.3
info:
  title: Community Health Hub API
  description: >
    API contract for the Community Health Hub (CHH) platform — blood donors,
    seekers, hospitals, and NGOs. Single source of truth for both the backend
    and frontend Coding Agents (see `.claude/rules/api-standards.md` §3).
  version: "1.0"
servers:
  - url: /api/v1
    description: CHH API v1 base path
tags:
  - name: Auth
    description: Mobile-number + OTP authentication (CHH-F01)
  - name: Individuals
    description: Individual user registration (CHH-F02)
  - name: BloodRequests
    description: Blood requests with proximity search radius (CHH-F04, Epic CHH-25)
  - name: Notifications
    description: >
      Per-donor notifications for matched blood requests (CHH-34/US-CHH-004-03,
      CHH-F04, Epic CHH-25).
  - name: Facilities
    description: Facility (hospital/blood-bank or NGO) self-registration (CHH-F03/CHH-78)
  - name: Events
    description: Community health events created by verified facilities (CHH-F05/CHH-38, Epic CHH-37)
  - name: Admin
    description: >
      System Admin moderation endpoints (CHH-F07 Admin Command Center, Epic
      CHH-72). Interim admin identity: mobile numbers whose
      IndividualProfile.IsAdmin flag is set are issued the "SystemAdmin" role
      on OTP verification — see the CHH-F07 LLD "Cross-cutting decisions" for why.
      Real Role/RoleId-based authorization (PRD §4) is future scope.
paths:
  /auth/otp/request:
    post:
      tags:
        - Auth
      summary: Request a one-time password for a mobile number
      description: >
        Accepts a 10-digit mobile number, generates and dispatches a 6-digit
        OTP via the SMS gateway, and returns confirmation data. Does not
        create an addressable resource, so a successful call returns
        `200 OK` rather than `201 Created` (`.claude/rules/api-standards.md` §1).
        Verifying the code is a separate endpoint (CHH-9), out of scope here.
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestRequest"
      responses:
        "200":
          description: OTP generated and dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "422":
          description: Mobile number missing or not a valid 10-digit number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Resend requested before the resend cooldown elapsed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502":
          description: The SMS gateway failed to dispatch the OTP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify a one-time password for a mobile number
      description: >
        Accepts a mobile number and the 6-digit code sent to it, and checks it
        against the most recently issued OTP for that number. On success,
        issues a JWT access token (CHH-F01 AC3) carrying the mobile number and
        a role claim — "Individual" if a completed registration exists for
        this number (CHH-F02), otherwise "Guest". Both cases return `200 OK`
        with the token; role-specific redirection is a frontend concern.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified; access token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "422":
          description: >
            Request malformed (mobile number/OTP code shape), the OTP code is
            wrong, or it has expired. A wrong code and "no OTP was ever
            requested for this number" deliberately share the same message
            (to avoid revealing which case occurred) — an expired code is
            reported distinctly since expiry is unambiguous once a matching
            OTP record exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /individuals:
    post:
      tags:
        - Individuals
      summary: Register an individual profile
      description: >
        Creates the individual profile completed after OTP verification
        (CHH-F02): personal details, blood group, DOB, gender, location, and
        health screening. `mobileNumber` must have a verified OTP already
        (CHH-9) — creates an addressable resource, so a successful call
        returns `201 Created` with a `Location` header
        (`.claude/rules/api-standards.md` §1/§2).
      operationId: registerIndividual
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndividualProfileRequest"
      responses:
        "201":
          description: Individual profile created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualProfileDto"
        "422":
          description: >
            Request malformed (field-level validation) or the mobile number
            does not have a verified OTP.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: An individual profile already exists for this mobile number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /individuals/me:
    get:
      tags:
        - Individuals
      summary: Get my own individual profile
      description: >
        Returns the authenticated caller's own profile (CHH-81 Individual
        Dashboard). 404 if the JWT's mobile number hasn't completed
        registration yet.
      operationId: getMyIndividualProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualProfileDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No individual profile exists for this mobile number yet.
    patch:
      tags:
        - Individuals
      summary: Update my own individual profile
      description: >
        Updates the authenticated caller's location and health-screening
        flags (CHH-F02 profile edit). Name, email, blood group, date of
        birth, and gender are not editable here. 404 if the JWT's mobile
        number hasn't completed registration yet.
      operationId: updateMyIndividualProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIndividualProfileRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualProfileDto"
        "422":
          description: Request malformed (field-level validation).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No individual profile exists for this mobile number yet.
  /blood-requests:
    post:
      tags:
        - BloodRequests
      summary: Create a blood request with a search radius
      description: >
        Creates a blood request (CHH-33/US-CHH-004-01, part of Epic CHH-25 —
        CHH-F04 Proximity Notifications) and transitions it to "Matching"
        (AC1). The requester is the authenticated caller — taken from the
        JWT, never a request body field. Creates an addressable resource, so
        a successful call returns `201 Created` with a `Location` header
        (`.claude/rules/api-standards.md` §1/§2). Donor matching and
        notification dispatch (CHH-34+) are out of scope here.
      operationId: createBloodRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBloodRequestRequest"
      responses:
        "201":
          description: Blood request created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created blood request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloodRequestDto"
        "422":
          description: >
            Request malformed (field-level validation) — including a search
            radius outside 5–100km (AC2/AC3), a missing mandatory field
            (AC4), or device location coordinates that could not be resolved
            (Edge Case).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid JWT.
  /blood-requests/mine:
    get:
      tags:
        - BloodRequests
      summary: List my own blood requests
      description: >
        Returns the authenticated caller's own blood requests, newest first
        (CHH-81 Individual Dashboard). An empty result is a normal `200`
        with an empty `items` array.
      operationId: listMyBloodRequests
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of the caller's own blood requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfBloodRequestDto"
        "401":
          description: Missing or invalid JWT.
  /blood-requests/{id}/matches:
    get:
      tags:
        - BloodRequests
      summary: Get my own request's match/response status
      description: >
        Returns the caller's own request's match/response status (CHH-36
        AC1/AC2/AC3). 404 if it doesn't exist or wasn't created by this
        caller. Donor identity is redacted until a donor accepts, per the
        guest-vs-registered visibility rule: a Guest caller's `donors` list
        contains only Accepted donors; a registered caller's list contains
        every matched donor, anonymized as "Donor 1", "Donor 2", ... until
        accepted. `notifiedCount == 0` while `status` is still "Matching"
        is the AC3 "no eligible donors found" signal.
      operationId: getBloodRequestMatchStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The request's match/response status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloodRequestMatchStatusDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No such request for this caller.
  /blood-requests/{id}/radius:
    patch:
      tags:
        - BloodRequests
      summary: Increase my own request's search radius
      description: >
        Expands the caller's own request's search radius and re-triggers
        the matching engine (CHH-36 AC4). Existing matches are unaffected —
        CHH-34's duplicate-prevention means only newly-in-range donors get
        a fresh notification. 404 if it doesn't exist or wasn't created by
        this caller. 422 if the request is no longer "Matching" (already
        fulfilled or expired — Edge Case) or the new radius isn't larger
        than the current one.
      operationId: updateBloodRequestRadius
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBloodRequestRadiusRequest"
      responses:
        "200":
          description: The updated match/response status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloodRequestMatchStatusDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No such request for this caller.
        "422":
          description: The request is no longer Matching, or the new radius isn't larger than the current one.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /facilities:
    post:
      tags:
        - Facilities
      summary: Register a facility
      description: >
        Creates a facility (hospital/blood-bank or NGO), pending System Admin
        verification (CHH-F03/CHH-78): name, category, sub-category, licence
        number, address, and 1–3 contacts. No JWT role is issued for
        Hospital/NGO yet (see CHH-F07's interim-admin note), so this is
        `security: []` like individual registration — creates an addressable
        resource, so a successful call returns `201 Created` with a
        `Location` header (`.claude/rules/api-standards.md` §1/§2).
      operationId: registerFacility
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFacilityRequest"
      responses:
        "201":
          description: Facility created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created facility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityDto"
        "422":
          description: >
            Request malformed (field-level validation) — including a
            sub-category that doesn't belong to the selected category.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: A facility already exists for this licence number.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /notifications/mine:
    get:
      tags:
        - Notifications
      summary: List my own donor notifications
      description: >
        Returns the authenticated caller's own notifications for matched
        blood requests, newest first (CHH-34 AC3). An empty result is a
        normal `200` with an empty `items` array — including when the
        caller hasn't registered an individual profile yet.
      operationId: listMyNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of the caller's own notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfDonorNotificationDto"
        "401":
          description: Missing or invalid JWT.
  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark one of my own notifications read
      description: >
        Marks one of the caller's own notifications read (CHH-34 AC3). 404 if
        it doesn't exist, belongs to a different donor, or the caller hasn't
        registered an individual profile yet.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorNotificationDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No such notification for this donor.
  /notifications/{id}/accept:
    patch:
      tags:
        - Notifications
      summary: Accept the matched blood request behind one of my own notifications
      description: >
        Accepts the matched blood request (CHH-35/US-CHH-004-04 AC1). 404 if
        the notification doesn't exist, belongs to a different donor, or the
        caller hasn't registered an individual profile yet. 409 if the donor
        already responded. 422 ("This request is no longer active") if the
        request has since been fulfilled or expired, or its last remaining
        unit was just taken by another donor (AC3 / Edge Case). On success,
        the response carries the requester's contact info and the request's
        location (AC4).
      operationId: acceptNotification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recorded acceptance, with the confirmation-view contact/location details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorResponseResultDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No such notification for this donor.
        "409":
          description: The donor already responded to this notification.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: The request is no longer active.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /notifications/{id}/decline:
    patch:
      tags:
        - Notifications
      summary: Decline the matched blood request behind one of my own notifications
      description: >
        Declines the matched blood request (CHH-35/US-CHH-004-04 AC2). 404 if
        the notification doesn't exist, belongs to a different donor, or the
        caller hasn't registered an individual profile yet. 409 if the donor
        already responded.
      operationId: declineNotification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recorded decline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorResponseResultDto"
        "401":
          description: Missing or invalid JWT.
        "404":
          description: No such notification for this donor.
        "409":
          description: The donor already responded to this notification.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /admin/facilities/pending:
    get:
      tags:
        - Admin
      summary: List facilities pending verification
      description: >
        Returns facilities with `verificationStatus = Pending`, ordered by
        registration date, for the System Admin's "Pending Verification" tab
        (CHH-73/US-CHH-001-01 AC1). An empty result is a normal `200` with an
        empty `items` array — the "No pending verifications at this time"
        message (AC2) is a frontend concern, not a distinct API shape.
      operationId: listPendingFacilities
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of pending facilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfFacilityDto"
        "401":
          description: Missing or invalid JWT.
        "403":
          description: Authenticated caller does not carry the SystemAdmin role.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /events:
    post:
      tags:
        - Events
      summary: Create a community health event
      description: >
        Creates a published event (CHH-38/US-CHH-005-01, part of Epic CHH-37 —
        CHH-F05 Location-Aware Events) for the caller's own facility. Restricted
        to the Hospital and Ngo roles, and further gated to only a `Verified`
        facility (spec's Business Rule: "Events must be created by verified
        facilities only") — an unverified caller gets `403`. Creates an
        addressable resource, so a successful call returns `201 Created` with a
        `Location` header (`.claude/rules/api-standards.md` §1/§2).
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created and published.
          headers:
            Location:
              schema:
                type: string
              description: URI of the created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "422":
          description: >
            Request malformed (field-level validation) — see spec §6.2, e.g. a
            title outside 5-100 characters, a start time not at least 1 hour in
            the future, an end time before the start time, capacity outside
            1-1,000, or an RSVP cut-off at or after the start time.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid JWT.
        "403":
          description: >
            Authenticated caller does not carry the Hospital/Ngo role, or their
            facility isn't yet Verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /auth/otp/verify (CHH-F01 AC3).
  schemas:
    OtpRequestRequest:
      type: object
      required:
        - mobileNumber
      properties:
        mobileNumber:
          type: string
          description: Exactly 10 digits, numeric only.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
    OtpRequestResponse:
      type: object
      required:
        - maskedMobileNumber
        - otpExpiresAtUtc
        - resendAvailableAtUtc
      properties:
        maskedMobileNumber:
          type: string
          description: All but the last 2 digits masked.
          example: "********10"
        otpExpiresAtUtc:
          type: string
          format: date-time
          description: UTC timestamp the OTP code expires (requested + 5 minutes).
        resendAvailableAtUtc:
          type: string
          format: date-time
          description: UTC timestamp a resend becomes available (requested + 120 seconds).
    OtpVerifyRequest:
      type: object
      required:
        - mobileNumber
        - otpCode
      properties:
        mobileNumber:
          type: string
          description: Exactly 10 digits, numeric only.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
        otpCode:
          type: string
          description: Exactly 6 digits, numeric only.
          pattern: "^[0-9]{6}$"
          example: "123456"
    OtpVerifyResponse:
      type: object
      required:
        - maskedMobileNumber
        - verifiedAtUtc
        - accessToken
        - tokenExpiresAtUtc
        - role
      properties:
        maskedMobileNumber:
          type: string
          description: All but the last 2 digits masked.
          example: "********10"
        verifiedAtUtc:
          type: string
          format: date-time
          description: UTC timestamp the OTP was successfully verified.
        accessToken:
          type: string
          description: >
            Signed JWT session token (CHH-F01 AC3). Carries the mobile number
            (`sub`) and `role` claims. Send as `Authorization: Bearer
            <accessToken>` on subsequent requests.
        tokenExpiresAtUtc:
          type: string
          format: date-time
          description: >
            UTC expiry of accessToken (24 hours from issuance — widened from
            the original CHH-F01 AC3 1-hour value by explicit product
            decision, 2026-09-07).
        role:
          type: string
          description: >
            Role assigned for this session (PRD §4 Role & Permission Matrix).
            "Individual" if a completed registration exists for this mobile
            number; "Hospital"/"Ngo" if the number matches a facility contact
            (CHH-73, regardless of the facility's verification status);
            "SystemAdmin" if the individual profile's IsAdmin flag is set;
            otherwise "Guest".
          enum: ["Guest", "Individual", "Hospital", "Ngo", "SystemAdmin"]
    BloodGroup:
      type: string
      description: Clinical blood group notation.
      enum: ["A+", "A-", "B+", "B-", "O+", "O-", "AB+", "AB-"]
    Gender:
      type: string
      enum: ["Male", "Female", "Other"]
    CreateIndividualProfileRequest:
      type: object
      required:
        - mobileNumber
        - fullName
        - email
        - bloodGroup
        - dateOfBirth
        - gender
        - locationCityArea
      properties:
        mobileNumber:
          type: string
          description: Must have a verified OTP (CHH-9) already.
          pattern: "^[0-9]{10}$"
          example: "9876543210"
        fullName:
          type: string
          description: 2–50 characters after trimming.
          example: "Jane Doe"
        email:
          type: string
          format: email
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        dateOfBirth:
          type: string
          format: date
          description: Must be in the past and indicate an age of 18 or older.
        gender:
          $ref: "#/components/schemas/Gender"
        locationCityArea:
          type: string
          description: >
            City/area, free text for now — a predefined/searchable list is an
            open product question (see the CHH-F02 doc's Open Questions).
        isChronicIllness:
          type: boolean
          default: false
        hasRecentSurgery:
          type: boolean
          default: false
        isInfectiousDisease:
          type: boolean
          default: false
        isUnderweight:
          type: boolean
          default: false
        isOtherIllness:
          type: boolean
          default: false
        otherIllnessDetails:
          type: string
          description: Required (max 200 chars) when isOtherIllness is true.
          maxLength: 200
    UpdateIndividualProfileRequest:
      type: object
      description: >
        Deliberately narrower than CreateIndividualProfileRequest — name,
        email, blood group, DOB, and gender are not editable here; only
        location and the health-screening flags are.
      required:
        - locationCityArea
      properties:
        locationCityArea:
          type: string
        isChronicIllness:
          type: boolean
          default: false
        hasRecentSurgery:
          type: boolean
          default: false
        isInfectiousDisease:
          type: boolean
          default: false
        isUnderweight:
          type: boolean
          default: false
        isOtherIllness:
          type: boolean
          default: false
        otherIllnessDetails:
          type: string
          description: Required (max 200 chars) when isOtherIllness is true.
          maxLength: 200
    IndividualProfileDto:
      type: object
      description: >
        Deliberately excludes email and DOB — PII the caller already knows
        and doesn't need echoed back. The raw health-screening flags ARE
        included so the caller's own profile-edit form (CHH-F02 profile
        edit) can pre-fill accurately instead of guessing from the derived
        isReceiverOnly flag alone.
      required:
        - id
        - fullName
        - bloodGroup
        - isReceiverOnly
        - locationCityArea
        - createdAtUtc
        - isChronicIllness
        - hasRecentSurgery
        - isInfectiousDisease
        - isUnderweight
        - isOtherIllness
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        isReceiverOnly:
          type: boolean
          description: >
            True if any health-restriction flag was set — excluded from
            donor search, can still request blood (PRD §7 CHH-F02 AC2).
        locationCityArea:
          type: string
          description: Registered city/area (CHH-81 dashboard profile summary).
        createdAtUtc:
          type: string
          format: date-time
        isChronicIllness:
          type: boolean
        hasRecentSurgery:
          type: boolean
        isInfectiousDisease:
          type: boolean
        isUnderweight:
          type: boolean
        isOtherIllness:
          type: boolean
        otherIllnessDetails:
          type: string
          maxLength: 200
    UrgencyLevel:
      type: string
      enum: ["Emergency", "Urgent", "Standard"]
    BloodRequestStatus:
      type: string
      description: >
        Only "Matching" is set on creation (AC1). "Fulfilled" is set once
        enough donors accept to cover unitsRequired (CHH-35 AC1/Edge Case).
        "Expired" is set once the 6-hour validity window elapses.
      enum: ["Matching", "Expired", "Fulfilled"]
    CreateBloodRequestRequest:
      type: object
      required:
        - requesterName
        - patientName
        - bloodGroup
        - unitsRequired
        - locationCityArea
        - latitude
        - longitude
        - searchRadiusKm
        - urgency
      properties:
        requesterName:
          type: string
          description: >
            The requester's own name — distinct from patientName (the person
            needing blood, who may not be the requester). Required for every
            requester, Guest or Individual: a Guest session has no registered
            profile to pull a name from, so the backend always requires it
            explicitly rather than looking it up.
        patientName:
          type: string
          description: 2–100 characters after trimming.
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        unitsRequired:
          type: integer
          description: Must be greater than 0.
          minimum: 1
        locationCityArea:
          type: string
          description: City/area, free text (same simplification as individual registration).
          maxLength: 100
        latitude:
          type: number
          format: double
          description: >
            From the requester's device (browser/device Geolocation) — not
            server-side geocoding (no maps API key configured yet). A
            missing/unresolvable value is the story's documented Edge Case.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          description: From the requester's device — see latitude.
          minimum: -180
          maximum: 180
        searchRadiusKm:
          type: integer
          description: Must be between 5 and 100 inclusive (AC2/AC3).
          minimum: 5
          maximum: 100
        urgency:
          $ref: "#/components/schemas/UrgencyLevel"
    BloodRequestDto:
      type: object
      required:
        - id
        - requesterName
        - patientName
        - bloodGroup
        - unitsRequired
        - locationCityArea
        - searchRadiusKm
        - urgency
        - status
        - createdAtUtc
        - expiresAtUtc
      properties:
        id:
          type: string
          format: uuid
        requesterName:
          type: string
        patientName:
          type: string
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        unitsRequired:
          type: integer
        locationCityArea:
          type: string
        searchRadiusKm:
          type: integer
        urgency:
          $ref: "#/components/schemas/UrgencyLevel"
        status:
          $ref: "#/components/schemas/BloodRequestStatus"
        createdAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
          description: createdAtUtc plus the 6-hour validity window.
    FacilityCategory:
      type: string
      enum: ["Hospital", "Ngo"]
    FacilitySubCategory:
      type: string
      description: >
        Finer classification within FacilityCategory (CHH-78 follow-up).
        Hospital may pick Government/Private/Trust; Ngo may pick
        RegisteredSociety/Trust/Section8Company — Trust is valid for either.
      enum: ["Government", "Private", "Trust", "RegisteredSociety", "Section8Company"]
    FacilityVerificationStatus:
      type: string
      enum: ["Pending", "Verified", "Rejected"]
    CreateFacilityContactRequest:
      type: object
      required:
        - name
        - designation
        - mobile
      properties:
        name:
          type: string
        designation:
          type: string
        mobile:
          type: string
          pattern: "^[0-9]{10}$"
    CreateFacilityRequest:
      type: object
      required:
        - facilityName
        - category
        - subCategory
        - licenseNumber
        - address
        - contacts
      properties:
        facilityName:
          type: string
          description: Registered name, at least 3 characters after trimming.
          example: "City General Hospital"
        category:
          $ref: "#/components/schemas/FacilityCategory"
        subCategory:
          $ref: "#/components/schemas/FacilitySubCategory"
          description: Must be one of the sub-categories valid for the selected category.
        licenseNumber:
          type: string
          description: Letters, numbers and hyphens only, as printed on the licence.
          pattern: "^[A-Za-z0-9-]+$"
        address:
          type: string
          description: Free text — building, street, area, city, PIN code.
        contacts:
          type: array
          description: 1–3 contacts.
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/CreateFacilityContactRequest"
    FacilityContactDto:
      type: object
      required:
        - name
        - designation
        - mobile
      properties:
        name:
          type: string
        designation:
          type: string
        mobile:
          type: string
          pattern: "^[0-9]{10}$"
    FacilityDto:
      type: object
      required:
        - id
        - facilityName
        - category
        - subCategory
        - licenseNumber
        - address
        - contacts
        - verificationStatus
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
        facilityName:
          type: string
        category:
          $ref: "#/components/schemas/FacilityCategory"
        subCategory:
          $ref: "#/components/schemas/FacilitySubCategory"
        licenseNumber:
          type: string
        address:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/FacilityContactDto"
        verificationStatus:
          $ref: "#/components/schemas/FacilityVerificationStatus"
        licenseDocumentUrl:
          type: string
          nullable: true
          description: Blob storage reference; populated by CHH-74's upload path, null until then.
        createdAtUtc:
          type: string
          format: date-time
          description: Also serves as "Date of Registration" (CHH-73 AC1).
    PagedResponseOfFacilityDto:
      type: object
      description: >
        Generic paging envelope (DOTNET-RULES §12) — this is the first
        paginated list endpoint in the contract; later list endpoints should
        follow the same `items`/`totalCount`/`page`/`pageSize` shape.
      required:
        - items
        - totalCount
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FacilityDto"
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    PagedResponseOfBloodRequestDto:
      type: object
      description: Generic paging envelope (DOTNET-RULES §12) — see PagedResponseOfFacilityDto.
      required:
        - items
        - totalCount
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BloodRequestDto"
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    UpdateBloodRequestRadiusRequest:
      type: object
      required:
        - searchRadiusKm
      properties:
        searchRadiusKm:
          type: integer
          description: Must be larger than the request's current radius, up to 100km.
    DonorStatusDto:
      type: object
      description: >
        Shaped per the donor-list visibility rule (CHH-36 Business Rules):
        identity is redacted behind label until the donor accepts.
      required:
        - label
        - isAccepted
      properties:
        label:
          type: string
          description: >
            "Donor 1"/"Donor 2"/... for a still-pending match (registered
            requester view only), or the donor's real full name once
            isAccepted is true.
        mobileNumber:
          type: string
          nullable: true
          description: Populated only when isAccepted is true.
        isAccepted:
          type: boolean
    BloodRequestMatchStatusDto:
      type: object
      description: >
        notifiedCount == 0 while status is still "Matching" is the AC3 "no
        eligible donors found" signal — there's no separate flag for it.
      required:
        - bloodRequestId
        - status
        - searchRadiusKm
        - unitsRequired
        - unitsAccepted
        - expiresAtUtc
        - notifiedCount
        - viewedCount
        - acceptedCount
        - donors
      properties:
        bloodRequestId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BloodRequestStatus"
        searchRadiusKm:
          type: integer
        unitsRequired:
          type: integer
        unitsAccepted:
          type: integer
        expiresAtUtc:
          type: string
          format: date-time
        notifiedCount:
          type: integer
          description: AC1 "Notifications Sent".
        viewedCount:
          type: integer
          description: AC1 "Viewed".
        acceptedCount:
          type: integer
          description: AC1 "Accepted".
        donors:
          type: array
          items:
            $ref: "#/components/schemas/DonorStatusDto"
    DonorNotificationDto:
      type: object
      description: >
        Deliberately excludes the patient's name and exact address (AC2 /
        off-app-delivery business rule) — only the four safe facts: blood
        group, units, urgency, and approximate distance/area.
      required:
        - id
        - bloodRequestId
        - bloodGroup
        - unitsRequired
        - urgency
        - distanceKm
        - areaLabel
        - isRead
        - createdAtUtc
        - responseStatus
      properties:
        id:
          type: string
          format: uuid
        bloodRequestId:
          type: string
          format: uuid
        bloodGroup:
          $ref: "#/components/schemas/BloodGroup"
        unitsRequired:
          type: integer
        urgency:
          $ref: "#/components/schemas/UrgencyLevel"
        distanceKm:
          type: number
          description: Approximate distance from the donor to the request, in kilometers.
        areaLabel:
          type: string
          description: The request's city/area — never the exact address.
        isRead:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        responseStatus:
          $ref: "#/components/schemas/DonorResponseStatus"
    DonorResponseStatus:
      type: string
      description: A donor's response to their own DonorNotification (CHH-35).
      enum: ["Pending", "Accepted", "Declined"]
    DonorResponseResultDto:
      type: object
      description: >
        The contact/location fields (AC4's "confirmation view") are only
        populated when responseStatus is "Accepted" — a decline has nothing
        to confirm.
      required:
        - notificationId
        - responseStatus
      properties:
        notificationId:
          type: string
          format: uuid
        responseStatus:
          $ref: "#/components/schemas/DonorResponseStatus"
        requesterMobileNumber:
          type: string
          nullable: true
        locationCityArea:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
    PagedResponseOfDonorNotificationDto:
      type: object
      description: Generic paging envelope (DOTNET-RULES §12) — see PagedResponseOfFacilityDto.
      required:
        - items
        - totalCount
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DonorNotificationDto"
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ProblemDetails:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    EventType:
      type: string
      description: The spec's fixed four community health event types.
      enum: ["BloodDonationCamp", "HealthCamp", "AwarenessSession", "Other"]
    CreateEventRequest:
      type: object
      required:
        - title
        - eventType
        - description
        - venueName
        - venueAddress
        - latitude
        - longitude
        - startAtUtc
        - endAtUtc
        - capacity
        - coordinatorName
        - coordinatorContact
      properties:
        title:
          type: string
          description: 5-100 characters after trimming.
        eventType:
          $ref: "#/components/schemas/EventType"
        description:
          type: string
          description: 20-1,000 characters after trimming.
        venueName:
          type: string
          description: 3-100 characters after trimming.
        venueAddress:
          type: string
          description: 10-250 characters after trimming.
        latitude:
          type: number
          description: Resolved from the venue address, or manually moved by the organizer.
        longitude:
          type: number
        startAtUtc:
          type: string
          format: date-time
          description: Must be at least 1 hour in the future.
        endAtUtc:
          type: string
          format: date-time
          description: Must be after startAtUtc.
        capacity:
          type: integer
          description: 1-1,000.
        coordinatorName:
          type: string
          description: 2-50 characters after trimming.
        coordinatorContact:
          type: string
          description: 10 digits — shown to attendees on the event page.
          pattern: "^[0-9]{10}$"
        rsvpCutoffAtUtc:
          type: string
          format: date-time
          nullable: true
          description: Optional. When set, must be before startAtUtc.
    EventDto:
      type: object
      required:
        - id
        - facilityId
        - title
        - eventType
        - description
        - venueName
        - venueAddress
        - latitude
        - longitude
        - startAtUtc
        - endAtUtc
        - capacity
        - coordinatorName
        - coordinatorContact
        - status
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        title:
          type: string
        eventType:
          $ref: "#/components/schemas/EventType"
        description:
          type: string
        venueName:
          type: string
        venueAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        startAtUtc:
          type: string
          format: date-time
        endAtUtc:
          type: string
          format: date-time
        capacity:
          type: integer
        coordinatorName:
          type: string
        coordinatorContact:
          type: string
        rsvpCutoffAtUtc:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: ["Published", "Cancelled"]
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
