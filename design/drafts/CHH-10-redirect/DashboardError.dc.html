<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --sand:#F6F0E5; --sand-2:#EFE7D9;
      --clay:#B06134; --blood:#D32F2F;
      --ink:#392A1D; --ink-2:#6F5C46; --ink-3:#A08A70; --ink-off:#BFAE96;
      --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0}
    .screen{width:390px;height:844px;background:var(--sand);font-family:var(--font);color:var(--ink);
      display:flex;flex-direction:column;position:relative;overflow:hidden}
    .brand{padding:56px 28px 0;flex:none}
    .mark{width:52px;height:52px;border-radius:999px;background:var(--blood);color:#fff;
      display:flex;align-items:center;justify-content:center;margin-bottom:14px}
    .wordmark{font-size:14px;font-weight:700;color:var(--ink-2)}
    .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px}
    .foot{flex:none;padding:0 28px 40px;text-align:center;font-size:12px;color:var(--ink-off)}

    .err{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 8px}
    .err .ic{width:68px;height:68px;border-radius:999px;background:var(--sand-2);color:var(--ink-3);
      display:flex;align-items:center;justify-content:center;margin-bottom:16px}
    .err b{font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
    .err p{margin:0 0 24px;font-size:14px;color:var(--ink-2);max-width:30ch;line-height:1.55}
    .err .acts{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px}
    .btn{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:15px;font-weight:600;width:100%}
    .b-primary{background:var(--clay);color:#fff}
    .b-ghost{background:transparent;color:var(--clay);height:44px}
  </style>
</helmet>

<div class="screen">
  <div class="brand">
    <div class="mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3.2c3.4 4 6 6.9 6 10a6 6 0 0 1-12 0c0-3.1 2.6-6 6-10Z"/>
      </svg>
    </div>
    <div class="wordmark">Community Health Hub</div>
  </div>
  <div class="mid">
    <div class="err">
      <div class="ic">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.5v17M6 5.5h11l2.5 3-2.5 3H6"/><path d="M6 13.5h9l2.5 3-2.5 3H6"/>
        </svg>
      </div>
      <b>We couldn't open your dashboard</b>
      <p>Your role wasn't confirmed, so we don't know which dashboard to open. A fresh sign-in usually clears this.</p>
      <div class="acts">
        <div class="btn b-primary">Try again</div>
        <div class="btn b-ghost">Sign in again</div>
      </div>
    </div>
  </div>
  <div class="foot">98&bull;&bull;&bull; &bull;&bull;210</div>
</div>

</x-dc>
</body>
</html>
