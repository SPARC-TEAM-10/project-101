<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --sand:#F6F0E5; --sand-2:#EFE7D9; --cream:#FDFAF4;
      --line:#E6DAC7; --line-strong:#D6C6AC;
      --clay:#B06134; --clay-tint:#F5E4D3;
      --blood:#D32F2F; --blood-tint:#FCE9E7;
      --ink:#392A1D; --ink-2:#6F5C46; --ink-3:#A08A70; --ink-off:#BFAE96;
      --leaf:#4E7A46; --leaf-tint:#E8F0E2;
      --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      --e1:0 1px 2px rgba(57,42,29,.04),0 2px 6px rgba(57,42,29,.05);
    }
    *{box-sizing:border-box}
    body{margin:0}
    .screen{width:1440px;height:900px;background:var(--sand);font-family:var(--font);color:var(--ink);
      display:grid;grid-template-columns:minmax(0,40%) 1fr;overflow:hidden}
    .illus{background:linear-gradient(135deg,var(--clay-tint),var(--blood-tint) 55%,var(--sand-2));
      display:flex;align-items:center;justify-content:center;padding:40px}
    .illus .ph{width:380px;height:520px;border-radius:20px;border:1.5px dashed var(--line-strong);
      background:rgba(253,250,244,.5);display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:10px;color:var(--ink-3);text-align:center;padding:24px}
    .illus .ph em{font-style:normal;font-size:12.5px;line-height:1.5}
    .illus .ph code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
      color:var(--ink-3)}
    .col{display:flex;flex-direction:column;min-width:0}
    .brand{padding:56px 64px 0;flex:none}
    .mark{width:52px;height:52px;border-radius:999px;background:var(--blood);color:#fff;
      display:flex;align-items:center;justify-content:center;margin-bottom:14px}
    .wordmark{font-size:14px;font-weight:700;color:var(--ink-2)}
    .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 64px;max-width:588px}
    h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0 0 8px}
    .sub{font-size:14.5px;color:var(--ink-2);line-height:1.6;margin:0 0 24px;max-width:34ch}
    .foot{flex:none;padding:0 64px 40px;text-align:left;font-size:12px;color:var(--ink-off);
      font-variant-numeric:tabular-nums}

    .steps{background:var(--cream);border:1px solid var(--line);border-radius:16px;
      box-shadow:var(--e1);padding:16px;display:flex;flex-direction:column;gap:12px}
    .step{display:flex;gap:12px;align-items:center;min-height:26px}
    .step b{font-size:14.5px;font-weight:600}
    .step.done b{color:var(--ink-2)}
    .tick{width:22px;height:22px;border-radius:999px;background:var(--leaf-tint);color:var(--leaf);
      display:flex;align-items:center;justify-content:center;flex:none}
    .spin{width:22px;height:22px;flex:none;border:2px solid var(--clay);
      border-right-color:transparent;border-radius:999px;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.spin{animation:none}}
    .sessnote{display:flex;gap:8px;align-items:center;margin:16px 0 0;
      font-size:12.5px;color:var(--ink-2)}
    .sessnote svg{flex:none;color:var(--ink-3)}
  </style>
</helmet>

<div class="screen">
  <div class="illus">
    <div class="ph">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.8"/>
        <path d="M3 16.5l5-4 4.5 3.5L16 12l5 4.5"/>
      </svg>
      <em>Illustration panel, as shipped</em>
      <code>/images/auth-otp-verify.png</code>
    </div>
  </div>
  <div class="col">
    <div class="brand">
      <div class="mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3.2c3.4 4 6 6.9 6 10a6 6 0 0 1-12 0c0-3.1 2.6-6 6-10Z"/>
        </svg>
      </div>
      <div class="wordmark">Community Health Hub</div>
    </div>
    <div class="mid">
      <h1>Signing you in</h1>
      <p class="sub">Your code checked out. We're opening the dashboard that matches your role.</p>
      <div class="steps">
        <div class="step done">
          <span class="tick">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12.5l5 5L20 6.5"/>
            </svg>
          </span>
          <b>Mobile number verified</b>
        </div>
        <div class="step now">
          <span class="spin"></span>
          <b>Opening the Admin Command Center</b>
        </div>
      </div>
      <p class="sessnote">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>
        </svg>
        Your session stays active for 24 hours.
      </p>
    </div>
    <div class="foot">Verifying 98&bull;&bull;&bull; &bull;&bull;210</div>
  </div>
</div>

</x-dc>
</body>
</html>
